 const rs=gp_rank(c.id,st),un=st.filter(s=>!s.group_id).length,old=D.rd.filter(r=>r.class_id===c.id).sort((a,b)=>b.to_day.localeCompare(a.to_day)).slice(0,4);
 return back+`<div class="row np" style="margin:10px 0;flex-wrap:wrap"><button class="btn" onclick="ask('إنهاء المسابقة؟ سيُعلن الفائز وتُصفَّر النقاط لبدء مسابقة جديدة.',endRound)">🏁 إنهاء المسابقة وتصفير النقاط</button><button class="btn alt" onclick="ask('إعادة التوزيع العشوائي؟ ستُحذف المجموعات الحالية ونقاطها.',()=>mkGroups(1))">إعادة التوزيع</button></div>${un?`<div class="alert">${un} طلاب بلا مجموعة. أضفهم من «الأعضاء».</div>`:''}`
 +rs.map((x,i)=>`<div class="card"><div class="row"><b style="font-size:20px;flex:0 0 28px">${i+1}</b><input value="${esc(x.g.name)}" onchange="renG('${x.g.id}',this.value)" style="font-weight:700"><span style="text-align:center;flex:0 0 76px"><b style="font-size:24px">${x.pts}</b><br><span class="mut">للفرد ${r1(x.avg)}</span></span></div>
 <div class="mut" style="margin:4px 0">${x.m.map(s=>esc(s.name)).join('، ')||'بلا أعضاء'}</div><div class="row np" style="flex-wrap:wrap;gap:6px">${[[1,'+1'],[2,'+2'],[5,'+5'],[-1,'−1']].map(a=>`<button class="btn ${a[0]<0?'bad':''} sm" onclick="gAdj('${x.g.id}',${a[0]})">${a[1]}</button>`).join('')}<button class="btn alt sm" onclick="memSheet('${x.g.id}')">الأعضاء</button></div></div>`).join('')
 +(old.length?`<h3>المسابقات السابقة</h3>${old.map(r=>`<div class="card">${r.from_day} ← ${r.to_day}: الفائز <b>${esc((r.result[0]||{}).name||'')}</b></div>`).join('')}`:'')}
async function gAdj(gid,p){const r=await db.from('group_pts').insert({group_id:gid,points:p}).select().single();if(r.error)return toast(r.error.message);D.gpt.push(r.data);render()}
function memSheet(gid){const g=D.gp.find(x=>x.id===gid),st=stList(),m=st.filter(s=>s.group_id===gid),o=st.filter(s=>s.group_id!==gid),gn=id=>(D.gp.find(x=>x.id===id)||{}).name||'';
 sheet(`<h2>${esc(g.name)}</h2><h3>الأعضاء (${m.length})</h3>${m.map(s=>`<div class="row" style="margin-bottom:6px"><span style="flex:1">${esc(s.name)}</span><select onchange="mvStu('${s.id}',this.value)" style="width:140px"><option value="">نقل إلى…</option>${D.gp.filter(x=>x.class_id===V.cid&&x.id!==gid).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}<option value="-">بلا مجموعة</option></select></div>`).join('')||'<p class="mut">لا أعضاء.</p>'}<h3>إضافة طالب إلى هذه المجموعة</h3><select onchange="if(this.value)mvStu(this.value,'${gid}')"><option value="">اختر طالبًا…</option>${o.map(s=>`<option value="${s.id}">${esc(s.name)}${s.group_id?' ('+esc(gn(s.group_id))+')':''}</option>`).join('')}</select>`)}
async function mvStu(sid,to){if(!sid||!to)return;const r=await db.from('students').update({group_id:to==='-'?null:to}).eq('id',sid).select().single();if(r.error)return toast(r.error.message);Object.assign(stu(sid),r.data);closeM();render()}
function acctView(){return `<div class="card"><h2>حسابي</h2><p dir="ltr" style="text-align:right">${esc(U.email)}</p><p class="mut">بياناتك محفوظة سحابيًا وتفتح من أي جهاز. زر «تحديث» يجلب آخر ما سُجّل من جهاز آخر.</p><button class="btn alt" onclick="db.auth.signOut().then(()=>location.reload())">تسجيل الخروج</button></div>`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&U&&!$('#ov').classList.contains('show')&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))load().then(ok=>ok&&render())});
init();
</script></body></html>
