<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المختبر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--tx:#12231f;--mut:#667871;--bd:#dbe5e1;--g:#14463b;--g2:#1d6150;--y:#f2c94c;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--paper:#fffdf5;--line:#d9e3ee}
@media (prefers-color-scheme:dark){:root{--bg:#0b1613;--card:#14241f;--tx:#e6f0ec;--mut:#8ea69e;--bd:#25382f;--g:#1d6150;--paper:#1a2622;--line:#2c3d46;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.5;padding-bottom:84px}
.top{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;border-bottom:4px solid var(--y);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:4}
.top h1{margin:0;font-size:19px;font-weight:800;flex:1}
.top button{background:#ffffff22;border:0;color:#fff;border-radius:10px;padding:6px 12px;font:inherit}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;color:var(--mut);margin:12px 0 6px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.bad{background:var(--bad)}.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.mut{color:var(--mut);font-size:14px}
.cls{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.cls b{font-size:18px}.cls span.go{background:var(--g);color:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
.modes{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.modes button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:700;color:var(--mut)}
.modes button.on{background:var(--g);color:#fff}
.sum{display:flex;gap:6px;margin-bottom:10px;font-size:14px;font-weight:700;flex-wrap:wrap}
.sum span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.t{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 3px 5px;text-align:center;user-select:none;min-height:74px}
.t i{font-style:normal;font-size:22px;font-weight:800;display:block;line-height:1.1}
.t u{text-decoration:none;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.t em{font-style:normal;font-size:11px;font-weight:800;position:absolute;top:3px;inset-inline-start:5px}
.t.a{background:var(--bad);border-color:var(--bad);color:#fff}.t.l{background:var(--warn);border-color:var(--warn);color:#fff}
.t.s{border-color:var(--info);background:color-mix(in srgb,var(--info) 18%,var(--card));box-shadow:0 0 0 2px var(--info)}
.t.s::after{content:"✓";position:absolute;top:2px;inset-inline-end:5px;color:var(--info);font-weight:800}
.abar{position:fixed;inset-inline:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--info);padding:8px 10px;z-index:6;box-shadow:0 -4px 14px #0003}
.abar .h{display:flex;gap:6px;align-items:center;margin-bottom:6px}.abar .h b{flex:1}
.ch{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.ch button{flex:0 0 auto;border:0;border-radius:20px;padding:8px 14px;font-weight:700;color:#fff}
.ch .p{background:var(--ok)}.ch .n{background:var(--bad)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:7}
nav button{flex:1;background:transparent;border:0;padding:8px 2px;font-weight:700;color:var(--mut);border-radius:10px}
nav button.on{color:var(--g);background:color-mix(in srgb,var(--y) 35%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 4px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{font-size:13px;color:var(--mut)}
.ev{background:var(--card);border:1px solid var(--bd);border-inline-start:5px solid var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ev.a{border-inline-start-color:var(--ok)}.ev .h{display:flex;justify-content:space-between;font-weight:700}
.ev .x{background:none;border:0;color:var(--mut);padding:2px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 14px;font-weight:700}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.paper{background:var(--paper);border:1px solid var(--bd);border-radius:6px 16px 16px 6px;padding:16px 18px 16px 16px;border-inline-start:14px solid var(--g);box-shadow:0 3px 10px #0002}
.paper h2{font-size:20px}
.paper label{font-size:14px;font-weight:700;color:var(--g);display:block;margin-top:10px}
.paper textarea,.paper input{background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);border:0;border-radius:0;line-height:32px;padding:0 4px;min-height:96px;resize:vertical}
.paper input{min-height:34px;background:none;border-bottom:2px solid var(--line)}
.paper textarea.big{min-height:360px}
#st{font-size:13px;color:var(--mut)}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}#ov.show{display:flex}
#sh{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;top:12px;inset-inline:12px;margin:auto;max-width:440px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;font-weight:700;z-index:20;display:none}
#toast u{text-decoration:underline;margin-inline-start:12px;cursor:pointer;color:var(--y)}
.pr{display:none}@media print{.top,nav,.np,#ov,.abar{display:none!important}body{background:#fff;color:#000;padding:0}.pr{display:block}}

.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.sc b{display:block;font-size:30px;line-height:1.2}
.alert{background:#fff4d6;color:#6b4a00;border:1px solid #f0d78a;border-radius:12px;padding:12px;margin-bottom:12px}.alert a{color:#8a4b00;font-weight:700}
.tb{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--bd)}.tb th{background:var(--g);color:#fff;padding:10px 8px;font-size:14px;text-align:right;white-space:nowrap}.tb td{padding:7px 8px;border-top:1px solid var(--bd);font-size:15px}.tb tr.c{cursor:pointer}.tb input{width:70px;margin:0;padding:6px;text-align:center}
@media(min-width:900px){nav{top:0;bottom:0;left:auto;right:0;inset-inline:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-left:1px solid var(--bd);padding:18px 10px}nav button{text-align:right;padding:12px 14px;font-size:16px}nav button.on{background:var(--g);color:#fff}.top,main{margin-right:210px}main{max-width:none}.abar{right:210px;left:0}body{padding-bottom:20px}}
</style></head><body>
<div class="top np"><h1 id="tt">سجل المختبر</h1><button onclick="refresh()">تحديث ↻</button></div>
<main id="app"></main><nav id="nav" class="np"></nav><div id="bar"></div>
<div id="ov"><div id="sh"></div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://mlbtrpwpmeymeykunrgh.supabase.co';
const SB_KEY='YOUR-PUBLISHABLE-KEY';
const $=s=>document.querySelector(s),app=$('#app'),AN='2000-01-01';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TD=()=>ymd(new Date());
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],dn=d=>d?DN[new Date(d+'T00:00:00').getDay()]:'';
const PP=[['مشاركة',2],['حل على السبورة',3],['مساعدة زميل',3],['التزام وانضباط',2],['تفوق',5]];
const NP=[['إزعاج',1],['تأخر',1],['نسيان الأدوات',1],['عدم أداء الواجب',1],['عدم احترام',2],['اعتداء',3],['إتلاف',2]];
let db,U,D={classes:[],students:[],att:[],recs:[],plans:{},gr:[],pe:{}},V={tab:'home',cid:null,sid:null,mode:'att',date:TD(),nb:AN},SEL=new Set(),LAST=[],ASK=null;
const stu=id=>D.students.find(s=>s.id===id),cls=id=>D.classes.find(c=>c.id===id);
const beh=id=>Math.max(0,100-D.recs.filter(r=>r.student_id===id&&r.kind==='v').reduce((a,r)=>a+r.points,0));
const act=id=>D.recs.filter(r=>r.student_id===id&&r.kind==='a').reduce((a,r)=>a+r.points,0);
const attOf=(id,d)=>(D.att.find(x=>x.student_id===id&&x.day===d)||{}).status||'';
const col=v=>v>=85?'var(--ok)':v>=65?'var(--warn)':'var(--bad)';
function toast(m,fn){const t=$('#toast');t.innerHTML=esc(m)+(fn?'<u onclick="UNDO()">تراجع</u>':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',fn?6000:2500)}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('show')}function closeM(){$('#ov').classList.remove('show')}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeM()};
function ask(m,fn){ASK=fn;sheet(`<h2>${m}</h2><div class="row"><button class="btn bad" onclick="closeM();ASK()">تأكيد</button><button class="btn alt" onclick="closeM()">إلغاء</button></div>`)}
function go(t,cid,sid){V.tab=t;if(cid!==undefined)V.cid=cid;if(sid!==undefined)V.sid=sid;SEL.clear();render();scrollTo(0,0)}
async function init(){
 if(SB_KEY.includes('YOUR-')){app.innerHTML='<div class="card"><h2>الإعداد مطلوب</h2><p>ضع المفتاح العام في السطر الثاني من الشيفرة.</p></div>';return}
 db=supabase.createClient(SB_URL,SB_KEY);const{data}=await db.auth.getSession();U=data.session&&data.session.user;U?boot():authView()}
function authView(up){$('#nav').innerHTML='';$('#bar').innerHTML='';app.innerHTML=`<div class="card" style="margin-top:24px"><h2>${up?'إنشاء حساب':'تسجيل الدخول'}</h2><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني"><input id="pw" type="password" dir="ltr" placeholder="كلمة السر"><button class="btn" onclick="doAuth(${!!up})">${up?'إنشاء الحساب':'دخول'}</button> <button class="btn alt sm" onclick="authView(${!up})">${up?'لدي حساب':'حساب جديد'}</button></div>`}
async function doAuth(up){const email=$('#em').value.trim(),password=$('#pw').value;if(!email||password.length<6)return toast('أدخل البريد وكلمة سر من 6 أحرف');
 const r=up?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});
 if(r.error)return toast(up&&/database/i.test(r.error.message)?'هذا البريد غير مسموح له بالتسجيل':'تعذّر الدخول: '+r.error.message);
 if(!r.data.session)return toast('فعّل حسابك من البريد ثم سجّل الدخول');U=r.data.user;boot()}
async function load(){const q=t=>db.from(t).select('*').limit(10000),q2=t=>q(t).then(r=>r.error?(D.noG=1,{data:[]}):r),R=await Promise.all([q('classes'),q('students'),q('attendance'),q('records'),q('plans'),q2('grades'),q2('periods')]),er=R.find(x=>x.error);
 if(er){toast('خطأ: '+er.error.message);return false}D.classes=R[0].data;D.students=R[1].data;D.att=R[2].data;D.recs=R[3].data;D.plans=Object.fromEntries(R[4].data.map(p=>[p.day,p]));D.gr=R[5].data;D.pe=Object.fromEntries(R[6].data.map(p=>[p.slot,p]));return true}
async function boot(){app.innerHTML='<p class="mut" style="text-align:center;margin-top:40px">جارٍ التحميل...</p>';if(await load())render()}
async function refresh(){if(U&&await load()){render();toast('تم التحديث')}}
function render(){const t=V.tab;let h,ti='لوحة التحكم';
 if(t==='class'){h=classView();ti=(cls(V.cid)||{}).name||''}else if(t==='student'){h=stuView();ti=(stu(V.sid)||{}).name||''}else if(t==='nb'){h=nbView();ti='الدفتر'}else if(t==='acct'){h=acctView();ti='حسابي'}else if(t==='students'){h=stView();ti='الطلاب'}else if(t==='gr'){h=grView();ti='الدرجات'}else h=homeView();
 app.innerHTML=h;$('#tt').textContent=ti;const c=t==='class'||t==='student'?'students':t;
 $('#nav').innerHTML=[['home','لوحة التحكم'],['students','الطلاب'],['gr','الدرجات'],['nb','الدفتر'],['acct','حسابي']].map(x=>`<button class="${c===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');bar()}

function homeView(){let exp=0;D.classes.forEach(c=>{const ids=new Set(D.students.filter(x=>x.class_id===c.id).map(x=>x.id));exp+=new Set(D.att.filter(a=>ids.has(a.student_id)).map(a=>a.day)).size*ids.size});
 const ab=D.att.filter(a=>a.status==='a').length,pa=exp?Math.min(100,Math.max(0,Math.round(100*(1-ab/exp)))):null,al=D.students.filter(x=>D.att.filter(a=>a.student_id===x.id&&a.status==='a').length>=3);
 return `<div class="stats3"><div class="sc"><span class="mut">إجمالي الطلاب</span><b>${D.students.length}</b></div><div class="sc"><span class="mut">نسبة الحضور</span><b style="color:var(--ok)">${pa===null?'—':pa+'%'}</b></div><div class="sc"><span class="mut">نسبة الغياب</span><b style="color:var(--bad)">${pa===null?'—':(100-pa)+'%'}</b></div></div>
 ${al.length?`<div class="alert"><b>تنبيه: ${al.length} طلاب تجاوزوا 3 غيابات</b><div style="margin-top:6px">${al.slice(0,10).map(x=>`<a href="#" onclick="go('student',null,'${x.id}');return false" style="margin-inline-end:12px">${esc(x.name)}</a>`).join('')}</div></div>`:''}
 <h3>ابدأ الحصة</h3>${D.classes.map(c=>`<button class="cls" onclick="V.mode='att';go('class','${c.id}')"><span><b>${esc(c.name)}</b><br><span class="mut">${D.students.filter(x=>x.class_id===c.id).length} طالبًا</span></span><span class="go">ابدأ</span></button>`).join('')||'<p class="mut">أضف أول صف.</p>'}<div class="card"><div class="row"><input id="ncn" placeholder="صف جديد، مثل: السادس أ"><button class="btn" onclick="addClass()">إضافة</button></div></div>`}
async function addClass(){const name=$('#ncn').value.trim();if(!name)return toast('اكتب الاسم');const r=await db.from('classes').insert({name}).select().single();if(r.error)return toast(r.error.message);D.classes.push(r.data);render()}

function stList(){return D.students.filter(s=>s.class_id===V.cid).sort((a,b)=>(a.seat||999)-(b.seat||999))}
function classView(){const st=stList(),n={a:0,l:0};st.forEach(s=>{const v=attOf(s.id,V.date);if(v)n[v]++});
 return `<div class="row np" style="margin-bottom:8px"><input type="date" value="${V.date}" onchange="V.date=this.value;SEL.clear();render()" style="flex:1"><button class="btn alt sm" onclick="mng()">⚙ إدارة</button></div>
 <div class="modes">${[['att','الحضور'],['rate','التقييم'],['file','الملفات']].map(m=>`<button class="${V.mode===m[0]?'on':''}" onclick="V.mode='${m[0]}';SEL.clear();render()">${m[1]}</button>`).join('')}</div>
 <div class="sum"><span>${dn(V.date)}</span><span style="color:var(--ok)">حاضر ${st.length-n.a}</span><span style="color:var(--bad)">غائب ${n.a}</span><span style="color:var(--warn)">متأخر ${n.l}</span></div>
 <p class="mut" style="margin:0 0 8px">${V.mode==='att'?'الجميع حاضر. المس من تغيّب (مرة غائب، مرتان متأخر).':V.mode==='rate'?'حدّد الطلاب بلمسهم ثم اختر من الشريط السفلي.':'المس طالبًا لفتح ملفه.'}${V.mode==='rate'?' <a href="#" onclick="selAll();return false">تحديد الكل</a>':''}</p>
 <div class="grid">${st.map(s=>{const v=attOf(s.id,V.date),nm=s.name.split(' ').slice(0,2).join(' ');return `<div class="t ${V.mode==='att'?v:''} ${SEL.has(s.id)?'s':''}" onclick="tap('${s.id}')"><em style="color:${V.mode==='att'&&v?'#fff':nc(s.id)}">${net(s.id)}</em><i>${s.seat||'-'}</i><u>${esc(nm)}</u></div>`}).join('')}</div>${st.length?'':'<p class="mut">لا يوجد طلاب. افتح «إدارة» لإضافتهم.</p>'}`}
function tap(id){if(V.mode==='file')return go('student',null,id);
 if(V.mode==='rate'){SEL.has(id)?SEL.delete(id):SEL.add(id);render();return}
 const o=['','a','l'],cur=attOf(id,V.date),nx=o[(o.indexOf(cur)+1)%3],i=D.att.findIndex(x=>x.student_id===id&&x.day===V.date);if(i>=0)D.att.splice(i,1);
 const q=nx?(D.att.push({student_id:id,day:V.date,status:nx}),db.from('attendance').upsert({student_id:id,day:V.date,status:nx},{onConflict:'student_id,day'})):db.from('attendance').delete().eq('student_id',id).eq('day',V.date);
 q.then(r=>{if(r.error)toast(r.error.message)});render()}
function selAll(){stList().forEach(s=>SEL.add(s.id));render()}
function bar(){const b=$('#bar');if(V.tab!=='class'||V.mode!=='rate'||!SEL.size){b.innerHTML='';return}
 b.innerHTML=`<div class="abar np"><div class="h"><b>محدَّد: ${SEL.size}</b><input id="qn" placeholder="ملاحظة (اختياري)" style="flex:2;margin:0;padding:6px 10px"><button class="btn alt sm" onclick="SEL.clear();render()">إلغاء</button></div>
 <div class="ch">${PP.map((x,i)=>`<button class="p" onclick="quick('a',${i})">＋${x[1]} ${x[0]}</button>`).join('')}</div><div class="ch" style="margin-top:4px">${NP.map((x,i)=>`<button class="n" onclick="quick('v',${i})">−${x[1]} ${x[0]}</button>`).join('')}</div></div>`}
async function quick(k,i){const x=(k==='a'?PP:NP)[i],note=($('#qn')||{}).value||'';
 if(k==='v'&&x[1]>=2&&!note.trim())return toast('اكتب الملاحظة أولًا: التفاصيل إلزامية لهذه المخالفة');
 const rows=[...SEL].map(id=>({student_id:id,kind:k,title:x[0],points:x[1],day:V.date,note:note.trim()||null})),r=await db.from('records').insert(rows).select();
 if(r.error)return toast(r.error.message);D.recs.push(...r.data);LAST=r.data.map(z=>z.id);SEL.clear();render();toast((k==='a'?'أُضيف ':'خُصم ')+x[1]+' لـ '+rows.length+' طالبًا',1)}
async function UNDO(){if(!LAST.length)return;const r=await db.from('records').delete().in('id',LAST);if(r.error)return toast(r.error.message);D.recs=D.recs.filter(z=>!LAST.includes(z.id));LAST=[];render();toast('تم التراجع')}
function mng(){sheet(`<h2>إدارة الصف</h2><h3>إضافة طلاب (اسم في كل سطر)</h3><textarea id="bulk" rows="6"></textarea><button class="btn" onclick="bulkAdd()">إضافة</button> <button class="btn alt" onclick="grp()">مجموعات عشوائية (6)</button> <button class="btn alt" onclick="delClass()">حذف الصف</button>`)}
async function bulkAdd(){const names=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!names.length)return toast('الصق الأسماء');let m=Math.max(0,...stList().map(s=>s.seat||0));
 const r=await db.from('students').insert(names.map(name=>({name,class_id:V.cid,seat:++m}))).select();if(r.error)return toast(r.error.message);D.students.push(...r.data);closeM();toast('أُضيف '+names.length);render()}
function delClass(){closeM();ask('حذف الصف وكل بياناته؟',async()=>{const r=await db.from('classes').delete().eq('id',V.cid);if(r.error)return toast(r.error.message);await load();go('home')})}

function stuView(){const s=stu(V.sid);if(!s)return homeView();const c=cls(s.class_id),b=beh(s.id),a=act(s.id),at={a:0,l:0};D.att.filter(x=>x.student_id===s.id).forEach(x=>at[x.status]=(at[x.status]||0)+1);
 const rs=D.recs.filter(r=>r.student_id===s.id).sort((x,y)=>y.day.localeCompare(x.day));
 return `<div class="row np" style="margin-bottom:10px"><button class="btn alt sm" onclick="V.mode='file';go('class','${c.id}')">› ${esc(c.name)}</button><button class="btn sm" onclick="print()">طباعة تقرير</button><button class="btn alt sm" onclick="editStu()">تعديل</button></div>
 <div class="pr"><h2>${esc(s.name)} — ${esc(c.name)}</h2>${TD()}</div>
 <div class="stats"><div class="stat"><b style="color:var(--ok)">${a}</b><span>نقاط النشاط</span></div><div class="stat"><b style="color:var(--bad)">${vi(s.id)}</b><span>نقاط الخصم</span></div><div class="stat"><b style="color:${nc(s.id)}">${net(s.id)}</b><span>الرصيد</span></div></div>
 <div class="card">الغياب: ${at.a} · التأخر: ${at.l}</div>
 <button class="btn np" onclick="manual()">＋ تسجيل يدوي بتاريخ آخر</button><h3>السجل الكامل</h3>
 ${rs.map(r=>`<div class="ev ${r.kind}"><div class="h"><span>${esc(r.title)}</span><span style="color:${r.kind==='v'?'var(--bad)':'var(--ok)'}">${r.kind==='v'?'−':'+'}${r.points}</span></div><div class="mut">${dn(r.day)} ${r.day}</div>${r.note?`<div>${esc(r.note)}</div>`:''}<button class="x np" onclick="delRec('${r.id}')">حذف</button></div>`).join('')||'<p class="mut">لا سجلات.</p>'}`}
function manual(){sheet(`<h2>تسجيل يدوي</h2><select id="mk"><option value="v">مخالفة (خصم)</option><option value="a">نشاط (إضافة)</option></select><input id="mt" placeholder="العنوان، مثل: إزعاج"><input id="mp" type="number" min="1" placeholder="النقاط"><input id="md" type="date" value="${TD()}"><textarea id="mn" placeholder="الملاحظات والتفاصيل"></textarea><button class="btn" onclick="saveManual()">حفظ</button>`)}
async function saveManual(){const kind=$('#mk').value,title=$('#mt').value.trim(),points=Math.abs(parseInt($('#mp').value)||0),day=$('#md').value,note=$('#mn').value.trim();if(!title||!points||!day)return toast('أكمل العنوان والنقاط والتاريخ');
 const r=await db.from('records').insert({student_id:V.sid,kind,title,points,day,note:note||null}).select().single();if(r.error)return toast(r.error.message);D.recs.push(r.data);closeM();render()}
function delRec(id){ask('حذف هذا السجل؟',async()=>{const r=await db.from('records').delete().eq('id',id);if(r.error)return toast(r.error.message);D.recs=D.recs.filter(x=>x.id!==id);render()})}
function editStu(){const s=stu(V.sid);sheet(`<h2>تعديل الطالب</h2><input id="en" value="${esc(s.name)}"><input id="es" type="number" value="${s.seat||''}" placeholder="رقم المقعد"><button class="btn" onclick="saveStu()">حفظ</button> <button class="btn alt" onclick="delStu()">حذف الطالب</button>`)}
async function saveStu(){const s=stu(V.sid),r=await db.from('students').update({name:$('#en').value.trim()||s.name,seat:parseInt($('#es').value)||null}).eq('id',s.id).select().single();if(r.error)return toast(r.error.message);Object.assign(s,r.data);closeM();render()}
function delStu(){closeM();ask('حذف الطالب وسجله؟',async()=>{const s=stu(V.sid),c=s.class_id,r=await db.from('students').delete().eq('id',s.id);if(r.error)return toast(r.error.message);await load();V.mode='file';go('class',c)})}

function nbView(){const days=Object.keys(D.plans).filter(d=>d!==AN).sort().reverse(),cur=V.nb,p=D.plans[cur]||{},an=cur===AN;
 return `<div class="tabs"><button class="${an?'on':''}" onclick="V.nb=AN;render()">الخطة السنوية</button>${!D.plans[TD()]?`<button class="${cur===TD()?'on':''}" onclick="V.nb=TD();render()">＋ اليوم</button>`:''}${days.map(d=>`<button class="${cur===d?'on':''}" onclick="V.nb='${d}';render()">${dn(d)} ${d.slice(5)}</button>`).join('')}</div>
 <div class="paper"><div class="row"><h2 style="flex:1;margin:0">${an?'الخطة السنوية العامة':dn(cur)+' — '+cur}</h2><span id="st">${p.id?'محفوظ ✓':'صفحة جديدة'}</span></div>
 ${an?`<label>الأهداف والمحاور وتوزيع الشهور</label><textarea id="p-goals" class="big" oninput="nbSave()">${esc(p.goals)}</textarea>`:`<label>موضوع الدرس</label><input id="p-topic" value="${esc(p.topic)}" oninput="nbSave()"><label>الأهداف</label><textarea id="p-goals" oninput="nbSave()">${esc(p.goals)}</textarea><label>الأنشطة</label><textarea id="p-act" oninput="nbSave()">${esc(p.activities)}</textarea><label>الواجب</label><textarea id="p-hw" oninput="nbSave()">${esc(p.homework)}</textarea>`}</div>
 ${an?'':`<div class="row np" style="margin-top:10px"><span class="mut">صفحة بتاريخ آخر:</span><input type="date" value="${cur}" onchange="V.nb=this.value;render()" style="flex:1"></div>`}`}
let NT,BUSY=false,DIRTY=false;
function nbSave(){$('#st').textContent='جارٍ الحفظ…';clearTimeout(NT);NT=setTimeout(doSave,700)}
async function doSave(){if(BUSY){DIRTY=true;return}BUSY=true;const g=s=>($(s)||{}).value||'',day=V.nb,row={day,topic:g('#p-topic'),goals:g('#p-goals'),activities:g('#p-act'),homework:g('#p-hw')},o=D.plans[day];
 const r=o?await db.from('plans').update(row).eq('id',o.id).select().single():await db.from('plans').insert(row).select().single();BUSY=false;
 if(r.error){$('#st')&&($('#st').textContent='فشل الحفظ');return toast(r.error.message)}D.plans[day]=r.data;if(V.nb===day&&$('#st'))$('#st').textContent='محفوظ ✓ '+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});if(DIRTY){DIRTY=false;doSave()}}

const vi=id=>D.recs.filter(r=>r.student_id===id&&r.kind==='v').reduce((a,r)=>a+r.points,0),net=id=>act(id)-vi(id),nc=id=>net(id)>=0?'var(--ok)':'var(--bad)';
function grp(){const a=stList().map(x=>x.name).sort(()=>Math.random()-.5),g=[];for(let i=0;i<a.length;i+=6)g.push(a.slice(i,i+6));if(g.length>1&&g[g.length-1].length<3)g.pop().forEach((n,i)=>g[i%g.length].push(n));
 sheet(`<h2>المجموعات العشوائية</h2>${g.map((x,i)=>`<div class="card"><b>المجموعة ${i+1}</b><br>${x.map(esc).join('، ')}</div>`).join('')||'<p class="mut">لا طلاب.</p>'}<button class="btn" onclick="grp()">إعادة التوزيع</button>`)}
function stView(){return `<div class="row" style="margin-bottom:10px"><input id="sq" placeholder="بحث بالاسم..." oninput="$('#tb').innerHTML=stRows()"><select id="sf" onchange="V.sf=this.value;render()" style="max-width:150px"><option value="">كل الصفوف</option>${D.classes.map(c=>`<option value="${c.id}" ${V.sf===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div style="overflow-x:auto"><table class="tb"><thead><tr><th>مقعد</th><th>الاسم</th><th>الصف</th><th>غياب</th><th>الرصيد</th></tr></thead><tbody id="tb">${stRows()}</tbody></table></div>${V.sf?`<button class="btn" style="margin-top:10px" onclick="V.mode='att';go('class','${V.sf}')">ابدأ الحصة لهذا الصف</button>`:''}`}
function stRows(){const q=(($('#sq')||{}).value||'').trim(),f=V.sf||'';return D.students.filter(x=>(!f||x.class_id===f)&&x.name.includes(q)).sort((a,b)=>(a.seat||999)-(b.seat||999)).map(x=>`<tr class="c" onclick="go('student',null,'${x.id}')"><td>${x.seat||'-'}</td><td>${esc(x.name)}</td><td>${esc((cls(x.class_id)||{}).name)}</td><td>${D.att.filter(a=>a.student_id===x.id&&a.status==='a').length}</td><td style="color:${nc(x.id)};font-weight:800">${net(x.id)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا نتائج</td></tr>'}

const SL=[['m1','الشهر 1'],['m2','الشهر 2'],['mid','نصف السنة'],['m3','الشهر 3'],['m4','الشهر 4']],fm=v=>v===null?'—':v;
const getG=(id,sl,c)=>{const g=D.gr.find(x=>x.student_id===id&&x.slot===sl&&x.comp===c);return g?Number(g.value):null};
const inR=(d,p)=>!!(p&&p.from_day&&p.to_day&&d>=p.from_day&&d<=p.to_day),sumR=(id,k,p)=>D.recs.filter(r=>r.student_id===id&&r.kind===k&&inR(r.day,p)).reduce((a,r)=>a+r.points,0);
function mo(id,sl){if(sl==='mid')return{total:getG(id,'mid','total')};const p=D.pe[sl],ok=!!(p&&p.from_day&&p.to_day),exam=getG(id,sl,'exam'),hw=getG(id,sl,'hw');
 const part=getG(id,sl,'part')??(ok?Math.min(10,sumR(id,'a',p)):null),beh=getG(id,sl,'beh')??(ok?Math.max(0,5-sumR(id,'v',p)):null);
 return{exam,part,hw,beh,total:[exam,part,hw,beh].every(x=>x!==null)?Math.min(100,exam+part+hw+beh):null}}
const sem=(id,a,b)=>{const x=mo(id,a).total,y=mo(id,b).total;return x===null||y===null?null:Math.floor((x+y)/2+0.5)};
const ann=id=>{const a=sem(id,'m1','m2'),m=mo(id,'mid').total,b=sem(id,'m3','m4');return a===null||m===null||b===null?null:Math.round((a+m+b)/3)};
function grView(){if(D.noG)return '<div class="card"><h2>الدرجات</h2><p>نفّذ ملف setup2.sql في Supabase (SQL Editor) ثم حدّث الصفحة.</p></div>';
 const sl=V.sl||'m1',cl=V.gc||(D.classes[0]||{}).id,st=D.students.filter(x=>x.class_id===cl).sort((a,b)=>(a.seat||999)-(b.seat||999)),p=D.pe[sl]||{},cs=!!p.closed;
 let h=`<div class="tabs">${D.classes.map(c=>`<button class="${cl===c.id?'on':''}" onclick="V.gc='${c.id}';render()">${esc(c.name)}</button>`).join('')}</div><div class="tabs">${SL.map(x=>`<button class="${sl===x[0]?'on':''}" onclick="V.sl='${x[0]}';render()">${x[1]}</button>`).join('')}<button class="${sl==='fin'?'on':''}" onclick="V.sl='fin';render()">السجل النهائي</button></div>`;
 if(sl==='fin')return h+`<div style="overflow-x:auto"><table class="tb"><thead><tr><th>الاسم</th><th>ش1</th><th>ش2</th><th>معدل ف1</th><th>نصف السنة</th><th>ش3</th><th>ش4</th><th>معدل ف2</th><th>السعي السنوي</th></tr></thead><tbody>${st.map(x=>{const a=ann(x.id);return `<tr><td>${esc(x.name)}</td><td>${fm(mo(x.id,'m1').total)}</td><td>${fm(mo(x.id,'m2').total)}</td><td>${fm(sem(x.id,'m1','m2'))}</td><td>${fm(mo(x.id,'mid').total)}</td><td>${fm(mo(x.id,'m3').total)}</td><td>${fm(mo(x.id,'m4').total)}</td><td>${fm(sem(x.id,'m3','m4'))}</td><td><b>${a===null?'غير مكتمل':a}</b></td></tr>`}).join('')}</tbody></table></div><p class="mut">معدل الفصل = (الشهرين) ÷ 2 مع جبر النصف. السعي السنوي = (ف1 + نصف السنة + ف2) ÷ 3 بإهمال الباقي 1 وجبر الباقي 2. «—» تعني بيانات ناقصة.</p>`;
 const inp=(id,c,v,mx,ov)=>`<input type="number" step="0.5" min="0" max="${mx}" value="${v===null?'':v}" ${cs?'disabled':''} style="${ov?'border-color:var(--y);border-width:2px':''}" onchange="saveG('${id}','${sl}','${c}',this.value,${mx})">`;
 h+=`<div class="card"><b>${(SL.find(x=>x[0]===sl)||[])[1]}</b> ${cs?'<span style="color:var(--bad)">· معتمد ومغلق</span>':''}${sl==='mid'?'':`<div class="row" style="margin-top:6px"><span class="mut">من</span><input type="date" value="${p.from_day||''}" ${cs?'disabled':''} onchange="upPeriod('${sl}',{from_day:this.value||null})"><span class="mut">إلى</span><input type="date" value="${p.to_day||''}" ${cs?'disabled':''} onchange="upPeriod('${sl}',{to_day:this.value||null})"></div><p class="mut" style="margin:4px 0 0">المشاركة والسلوك تُحسبان تلقائيًا من أحداث هذه الفترة، ويمكنك تعديلهما يدويًا (حقل بإطار أصفر = معدَّل).</p>`}
 <div style="margin-top:8px">${cs?`<button class="btn alt sm" onclick="reopen('${sl}')">إعادة الفتح</button>`:`<button class="btn sm" onclick="closeMonth('${sl}')">اعتماد وإغلاق</button>`}</div></div>
 <div style="overflow-x:auto"><table class="tb"><thead><tr><th>الاسم</th>${sl==='mid'?'<th>الدرجة /100</th>':'<th>امتحان /80</th><th>مشاركة /10</th><th>واجب ودفتر /5</th><th>سلوك /5</th><th>المجموع</th>'}</tr></thead><tbody>${st.map(x=>{const m=mo(x.id,sl);return `<tr><td>${esc(x.name)}</td>${sl==='mid'?`<td>${inp(x.id,'total',m.total,100,0)}</td>`:`<td>${inp(x.id,'exam',m.exam,80,0)}</td><td>${inp(x.id,'part',m.part,10,getG(x.id,sl,'part')!==null)}</td><td>${inp(x.id,'hw',m.hw,5,0)}</td><td>${inp(x.id,'beh',m.beh,5,getG(x.id,sl,'beh')!==null)}</td><td id="tot${x.id}"><b>${m.total===null?'غير مكتمل':m.total}</b></td>`}</tr>`}).join('')||'<tr><td class="mut">لا طلاب في هذا الصف</td></tr>'}</tbody></table></div>`;return h}
async function saveG(id,sl,c,v,mx){v=v.trim();const i=D.gr.findIndex(x=>x.student_id===id&&x.slot===sl&&x.comp===c);
 if(v===''){if(i>=0){const k=D.gr[i].id;D.gr.splice(i,1);const r=await db.from('grades').delete().eq('id',k);if(r.error)toast(r.error.message)}return render()}
 const n=parseFloat(v);if(isNaN(n)||n<0||n>mx){toast('الدرجة بين 0 و '+mx);return render()}
 const r=await db.from('grades').upsert({student_id:id,slot:sl,comp:c,value:n},{onConflict:'student_id,slot,comp'}).select().single();if(r.error)return toast(r.error.message);
 if(i>=0)D.gr.splice(i,1);D.gr.push(r.data);const t=$('#tot'+id);if(t){const m=mo(id,sl);t.innerHTML='<b>'+(m.total===null?'غير مكتمل':m.total)+'</b>'}}
async function upPeriod(sl,patch){const o=D.pe[sl],r=o?await db.from('periods').update(patch).eq('id',o.id).select().single():await db.from('periods').insert({slot:sl,...patch}).select().single();if(r.error)return toast(r.error.message);D.pe[sl]=r.data;render()}
function closeMonth(sl){const inc=D.students.filter(x=>mo(x.id,sl).total===null).length;ask('اعتماد وإغلاق هذه الفترة؟'+(inc?' (بيانات '+inc+' طالبًا غير مكتملة)':'')+' لا تُعدَّل الدرجات بعدها إلا بإعادة الفتح بسبب موثّق.',()=>upPeriod(sl,{closed:true}))}
function reopen(sl){sheet(`<h2>إعادة فتح الفترة</h2><textarea id="rsn" placeholder="سبب إعادة الفتح (إلزامي)"></textarea><button class="btn" onclick="const t=$('#rsn').value.trim();if(!t)return toast('اكتب السبب');closeM();upPeriod('${sl}',{closed:false,reason:t})">إعادة الفتح</button>`)}
function acctView(){return `<div class="card"><h2>حسابي</h2><p dir="ltr" style="text-align:right">${esc(U.email)}</p><p class="mut">بياناتك محفوظة سحابيًا وتفتح من أي جهاز. زر «تحديث» يجلب آخر ما سُجّل من جهاز آخر.</p><button class="btn alt" onclick="db.auth.signOut().then(()=>location.reload())">تسجيل الخروج</button></div>`}
init();
</script></body></html>
